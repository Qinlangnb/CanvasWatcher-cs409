server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # The API trusts one proxy hop (TRUST_PROXY=1) to find the client address for sign-in throttling.
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Bounded multi-round AI requests can outlast nginx's default 60 seconds.
  location /api/ai/chat { proxy_pass http://backend:8000; proxy_read_timeout 1500s; }
  location /api/ { proxy_pass http://backend:8000; }
  # The public deployment may mount this app at a path such as /watcher. Strip
  # that path before forwarding API requests; root-path development remains valid.
  location ~ ^/(?:[^/]+/)*api/ai/chat(?:/|$) {
    rewrite ^/(?:[^/]+/)*(api/ai/chat.*)$ /$1 break;
    proxy_pass http://backend:8000;
    proxy_read_timeout 1500s;
  }
  location ~ ^/(?:[^/]+/)*api/ {
    rewrite ^/(?:[^/]+/)*(api/.*)$ /$1 break;
    proxy_pass http://backend:8000;
  }
  # Vite emits built assets under assets/ while prefixing their public URLs.
  # Built file names change with their content, so browsers may keep them for good.
  location ~ ^/(?:[^/]+/)*assets/(.*)$ {
    alias /usr/share/nginx/html/assets/$1;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # The page itself is checked on every visit, so a new deploy shows without a manual refresh.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location / { try_files $uri /index.html; }
}
