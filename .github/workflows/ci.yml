name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canvaswatcher
          POSTGRES_PASSWORD: canvaswatcher
          POSTGRES_DB: canvaswatcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canvaswatcher -d canvaswatcher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test setup creates this database and applies the migrations.
      TEST_DATABASE_URL: postgresql://canvaswatcher:canvaswatcher@localhost:5432/canvaswatcher_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
