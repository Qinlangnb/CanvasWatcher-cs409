# Local stack: PostgreSQL, the Node API and the built frontend.
#   cp .env.example .env   (then set SESSION_SECRET)
#   docker compose up -d --build
# For development, `docker compose up -d db` starts only the database (see README.md, "Develop").
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canvaswatcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canvaswatcher}
      POSTGRES_DB: canvaswatcher
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvaswatcher -d canvaswatcher"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The service name and port match frontend/nginx.conf, which proxies /api to backend:8000.
  backend:
    build: ./server
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://canvaswatcher:${POSTGRES_PASSWORD:-canvaswatcher}@db:5432/canvaswatcher
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      # Only nginx (the frontend service) can reach the API, so trust exactly one proxy hop.
      TRUST_PROXY: "1"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
